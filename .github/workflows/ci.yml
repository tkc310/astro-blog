name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .tool-versions
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # 失敗したときは scripts/ci-step.sh が出力の末尾を注釈に出す（docs/ai-agents.md）。
      # astro check は型の生成（.astro/types.d.ts）も行うので、vp check より先に回す。
      - name: Type check (.astro)
        run: scripts/ci-step.sh "astro check" vp run typecheck

      - name: Format, lint, type check
        run: scripts/ci-step.sh "vp check" vp check

      - name: Test
        run: scripts/ci-step.sh "vp test" vp test

      - name: Build
        run: scripts/ci-step.sh "astro build" vp run build

      - name: Check build output
        run: scripts/ci-step.sh "check-output" vp run check-output
