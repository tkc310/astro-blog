name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .tool-versions
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # 手元と同じ make のコマンドで回す（ADR-0014）。Makefile が壊れれば CI で気づける。
      # 失敗したときは scripts/ci-step.sh が出力の末尾を注釈に出す（docs/ai-agents.md）。
      - name: Type check (.astro)
        run: scripts/ci-step.sh "make typecheck" make typecheck

      - name: Format, lint, type check
        run: scripts/ci-step.sh "make lint" make lint

      - name: Test
        run: scripts/ci-step.sh "make test" make test

      - name: Build
        run: scripts/ci-step.sh "make build" make build

      - name: Check build output
        run: scripts/ci-step.sh "make check-output" make check-output
