name: Lockfile

# package.json の依存を変えた PR で、pnpm-lock.yaml を作り直して PR のブランチにコミットする。
# npm のレジストリに届かない環境のエージェントが依存を足せるようにするため（docs/ai-agents.md）。
# ボットのコミットで動く CI は、人（かエージェント）が承認してから回る。
on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .tool-versions
          run-install: false

      - name: Update lockfile
        run: scripts/ci-step.sh "pnpm install --lockfile-only" pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml は最新です。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -q -m "build: ロックファイルを更新する"
          git push -q origin "HEAD:${GITHUB_HEAD_REF}"
